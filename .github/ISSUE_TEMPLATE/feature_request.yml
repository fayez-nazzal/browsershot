name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are hitting
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: The outcome you want
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Anything you tried
      description: Flags, workarounds or other tools.
    validations:
      required: false
